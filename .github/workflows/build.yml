name: Build MCT-Flasher iOS ipa
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project MCTFlasher.xcodeproj -scheme MCTFlasher \
            -configuration Release -destination "generic/platform=iOS" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned ipa
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/MCTFlasher.app Payload/
          zip -r MCTFlasher.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MCTFlasher-ipa
          path: MCTFlasher.ipa
