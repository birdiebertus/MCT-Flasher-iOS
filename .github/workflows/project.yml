name: MCTFlasher
options:
  bundleIdPrefix: nl.avt.mct
  deploymentTarget:
    iOS: "16.0"
targets:
  MCTFlasher:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
    settings:
      base:
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
